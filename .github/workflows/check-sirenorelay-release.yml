name: Check SirenoRELAY release

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: addon-release
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - name: Detect and pin latest SirenoRELAY release
        run: bash .github/scripts/bump-sirenorelay.sh
      - name: Commit update
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md sirenorelay/Dockerfile sirenorelay/config.yaml
          git commit -m "chore(sirenorelay): bump upstream release"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          version="$(sed -n -E 's/^version: "([^"]+)"$/\1/p' sirenorelay/config.yaml)"
          gh release create "v${version}" --title "SirenoRELAY add-on ${version}" --notes "Updates SirenoRELAY to its latest stable release."
