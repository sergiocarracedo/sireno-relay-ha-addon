name: Publish add-on image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Add-on version from sirenorelay/config.yaml
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - name: Build and smoke-test amd64 image
        run: |
          docker build \
            --build-arg BUILD_VERSION=${{ github.event.release.tag_name || inputs.version }} \
            --build-arg BUILD_ARCH=amd64 \
            -t sirenorelay-ha-addon:test sirenorelay
          bash tests/smoke.sh
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${INPUT_VERSION:-${RELEASE_TAG#v}}"
          [[ "$version" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}-[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./sirenorelay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.value }}
