name: SirenoRELAY
version: "2026.10.21-1"
slug: sirenorelay
description: Policy-filtered MCP email relay. Configure it from the Web UI.
url: https://github.com/sergiocarracedo/sireno-relay-ha-addon
image: ghcr.io/sergiocarracedo/sireno-relay-ha-addon
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
backup: cold
ingress: true
ingress_port: 8099
ingress_stream: true
panel_admin: true
panel_title: SirenoRELAY
panel_icon: mdi:email-lock-outline
ports:
  8443/tcp: null
ports_description:
  8443/tcp: HTTPS MCP endpoint for trusted LAN clients (requires TLS options)
map:
  - type: data
    path: /data
  - type: ssl
    path: /ssl
    read_only: true
schema: false
