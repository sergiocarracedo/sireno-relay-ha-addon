worker_processes 1;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  access_log /dev/stdout;
  client_body_temp_path /run/nginx/body;
  proxy_temp_path /run/nginx/proxy;
  include /run/sirenorelay/*.conf;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 8099;
    allow 127.0.0.1;
    allow 172.30.32.2;
    deny all;

    location = /terminal { return 302 /terminal/; }
    location /terminal/ {
      proxy_pass http://127.0.0.1:7681/terminal/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 86400s;
    }
    location /onboard/ {
      proxy_pass http://127.0.0.1:7682/onboard/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 86400s;
    }
    location / {
      default_type text/html;
      return 200 '<!doctype html><title>SirenoRELAY</title><style>body{margin:3rem;max-width:46rem;background:#101814;color:#edf7ef;font:16px system-ui}a{display:inline-block;margin:.5rem .5rem 0 0;padding:.7rem 1rem;border-radius:.5rem;background:#d2f824;color:#142019;text-decoration:none;font-weight:bold}.secondary{background:#254332;color:#edf7ef}code{color:#bfe4c8}</style><h1>SirenoRELAY</h1><p>Run first-time setup to create your email connection and access token. When it finishes, the generated <code>config.yml</code> is copied into the Home Assistant <strong>Configuration</strong> tab for future edits.</p><p><a href="$http_x_ingress_path/onboard/">Run first-time setup</a><a class="secondary" href="$http_x_ingress_path/terminal/">Open terminal</a></p>';
    }
  }
}
